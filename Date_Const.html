<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        let d= new Date()

        x=d.getDate()
        document.write(x)

        y=d.getDay()
        document.write(y)

        z=d.getFullYear()
        document.write(z)

        a=d.getMilliseconds()
        document.write(a)

        b=d.getUTCMonth()+1
        document.write(b)


        </script>
    
</body>
</html>
